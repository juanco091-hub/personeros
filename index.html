<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Electoral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="config.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        .tab-prov-active { 
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important; 
            color: #ffffff !important; 
            font-weight: 900 !important;
            box-shadow: 0 6px 18px -2px rgba(217, 119, 6, 0.5), 0 0 0 2px #ffffff !important;
            transform: scale(1.02);
        }
        .carousel-drag {
            cursor: grab;
            scroll-behavior: smooth;
        }
        .carousel-drag:active {
            cursor: grabbing;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .section-district {
            contain: content;
        }
        /* Estilo personalizado para la barra de desplazamiento de suplentes */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-16 text-slate-800">

    <header id="headerBanner" class="bg-gradient-to-r text-white shadow-xl relative overflow-hidden">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <div onclick="resetWeb()" class="z-10 text-center md:text-left cursor-pointer hover:opacity-95 transition group">
                <div id="cfgSubtituloBanner" class="inline-block bg-white/20 text-blue-100 text-[10px] sm:text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider mb-1 border border-white/20">
                    Elecciones Regionales 4 de Octubre
                </div>
                <h1 id="cfgTituloPrincipal" class="text-xl sm:text-2xl md:text-3xl font-black tracking-tight group-hover:text-amber-300 transition">
                    Sistema de Control de Personeros
                </h1>
                <p id="cfgNombreRegion" class="text-blue-200 text-xs font-medium mt-0.5">
                    Región Pasco • Monitoreo de Mesas de Votación
                </p>
            </div>

            <div onclick="resetWeb()" class="z-10 cursor-pointer">
                <div class="bg-white/10 backdrop-blur-md p-2 px-3.5 rounded-2xl border border-white/20 flex items-center gap-2.5 hover:bg-white/20 transition shadow-lg">
                    <div class="w-10 h-10 rounded-xl bg-white p-0.5 border border-white/40 flex-shrink-0 flex items-center justify-center overflow-hidden shadow-inner">
                        <img src="portadas/logo_partido.jpg" onerror="this.onerror=null; this.src='portadas/logo_partido.png'; this.onerror=function(){this.parentElement.innerHTML='<span class=\'font-black text-blue-900 text-lg\'>PAS</span>';}" alt="Logo Partido" class="w-full h-full object-contain rounded-lg">
                    </div>
                    <div class="text-left">
                        <p id="cfgSubtextoPartido" class="text-[9px] text-blue-200 font-bold uppercase tracking-wide">Partido Político</p>
                        <p id="cfgNombrePartido" class="text-xs sm:text-sm font-extrabold text-white leading-tight">FRENTE PASCO UNIDO</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-white/10 rounded-full blur-2xl pointer-events-none"></div>
    </header>

    <main class="max-w-6xl mx-auto px-2.5 sm:px-4 md:px-6 mt-4">

        <div class="sticky top-0 z-30 -mx-2.5 sm:-mx-4 md:-mx-6 px-2.5 sm:px-4 md:px-6 py-2.5 bg-slate-100/95 backdrop-blur-md shadow-xs transition-all">
            
            <div class="relative mb-2.5">
                <div id="provinceCarousel" class="carousel-drag no-scrollbar flex gap-2.5 overflow-x-auto bg-slate-200/90 p-2 rounded-2xl shadow-inner border border-slate-300/70 snap-x">
                </div>
            </div>

            <div class="bg-white p-2.5 sm:p-3 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex items-center gap-2">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs sm:text-sm"></i>
                        <input type="text" id="searchInput" oninput="handleSearchInput()" placeholder="Buscar mesa, distrito, local..." class="w-full pl-8 sm:pl-9 pr-8 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 transition">
                        <button id="btnClearSearch" onclick="clearSearch()" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-600 text-xs flex items-center justify-center transition">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <button onclick="toggleConsolidado()" title="Mostrar/Ocultar Resumen" class="w-9 h-9 sm:w-10 sm:h-10 flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-xl flex items-center justify-center border border-slate-200 transition shadow-xs">
                        <i class="fa-solid fa-chart-pie text-amber-600 text-sm sm:text-base"></i>
                    </button>

                    <button onclick="toggleModoVista()" id="btnToggleModo" title="Cambiar Vista" class="w-9 h-9 sm:w-10 sm:h-10 flex-shrink-0 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 rounded-xl flex items-center justify-center border border-slate-200 transition shadow-xs">
                        <i id="iconModo" class="fa-solid fa-list text-slate-600 text-sm sm:text-base"></i>
                    </button>
                </div>

                <div id="consolidadoPanel" class="hidden mt-2.5 pt-2.5 border-t border-slate-100 transition-all">
                    <div class="grid grid-cols-3 gap-1.5 text-[11px] font-semibold">
                        <button onclick="setFilter('all')" id="filter-all" class="py-1.5 px-2 rounded-xl text-center bg-slate-900 text-white font-bold">
                            Todas (<span id="cnt-all">0</span>)
                        </button>
                        <button onclick="setFilter('assigned')" id="filter-assigned" class="py-1.5 px-2 rounded-xl text-center text-slate-700 bg-slate-50 border border-slate-200">
                            <span class="inline-block w-2 h-2 rounded-full bg-blue-600 mr-1"></span>Con Personero (<span id="cnt-assigned">0</span>)
                        </button>
                        <button onclick="setFilter('unassigned')" id="filter-unassigned" class="py-1.5 px-2 rounded-xl text-center text-slate-700 bg-slate-50 border border-slate-200">
                            <span class="inline-block w-2 h-2 rounded-full bg-red-500 mr-1"></span>Sin Personero (<span id="cnt-unassigned">0</span>)
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <div id="districtContainer" class="space-y-4 mt-3">
        </div>

    </main>

    <button id="btnScrollTop" onclick="scrollToTop()" title="Volver al inicio" class="fixed bottom-5 right-5 w-11 h-11 rounded-full bg-amber-500 hover:bg-amber-600 text-white shadow-xl flex items-center justify-center text-lg transition-all duration-300 opacity-0 pointer-events-none z-40 border-2 border-white">
        <i class="fa-solid fa-arrow-up"></i>
    </button>

    <div id="mesaModal" class="fixed inset-0 bg-slate-900/70 z-50 hidden flex items-center justify-center p-3 sm:p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full overflow-hidden border border-slate-100 transform transition-all max-h-[90vh] flex flex-col">
            <div class="bg-slate-900 text-white p-3.5 flex justify-between items-center flex-shrink-0">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
                    <h3 class="font-bold text-xs sm:text-sm">Detalle de Mesa de Votación</h3>
                </div>
                <button onclick="cerrarModal()" class="w-7 h-7 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white text-xs transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="modalBody" class="p-4 text-xs text-slate-700 space-y-3 overflow-y-auto custom-scroll flex-1">
            </div>
            <div class="bg-slate-50 p-2.5 border-t border-slate-100 text-center flex-shrink-0">
                <button onclick="cerrarModal()" class="w-full py-2 bg-slate-800 text-white rounded-xl text-xs font-bold shadow-md hover:bg-slate-900 transition">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        let rawData = [];
        let currentProvinceKey = '';
        let currentFilter = 'all';
        let modoVista = 2;
        let mostrarConsolidado = false;
        let searchDebounceTimeout = null;

        window.mesaByNumMap = {};

        function initConfig() {
            if (typeof CONFIG !== 'undefined') {
                document.getElementById('cfgSubtituloBanner').innerText = CONFIG.TITULO_SUBTÍTULO_BANNER || 'Elecciones Regionales';
                document.getElementById('cfgTituloPrincipal').innerText = CONFIG.TITULO_PRINCIPAL || 'Sistema Electoral';
                document.getElementById('cfgNombreRegion').innerText = `${CONFIG.NOMBRE_REGION || 'Región'} • Monitoreo de Mesas`;
                document.getElementById('cfgNombrePartido').innerText = CONFIG.NOMBRE_PARTIDO || 'Partido Político';
                document.getElementById('cfgSubtextoPartido').innerText = CONFIG.SUBTEXTO_PARTIDO || 'Agrupación';

                const banner = document.getElementById('headerBanner');
                banner.className = `bg-gradient-to-r ${CONFIG.BANNER_GRADIENTE_COLOR || 'from-blue-900 to-indigo-900'} text-white shadow-xl relative overflow-hidden`;

                const carousel = document.getElementById('provinceCarousel');
                carousel.innerHTML = '';
                const provKeys = Object.keys(CONFIG.SHEET_URLS || {});
                
                if (provKeys.length > 0) {
                    currentProvinceKey = provKeys[0];
                    provKeys.forEach((key, i) => {
                        const btn = document.createElement('button');
                        btn.id = `btn-prov-${i}`;
                        btn.onclick = () => selectProvince(key, i);
                        
                        let labelHtml = key.replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                        
                        btn.className = `min-w-[130px] sm:min-w-[150px] h-14 sm:h-16 px-3 py-1.5 text-xs sm:text-sm rounded-2xl transition-all duration-200 text-center font-bold snap-start flex-shrink-0 flex items-center justify-center leading-tight ${i===0 ? 'tab-prov-active' : 'text-slate-700 hover:text-slate-900 bg-white shadow-xs border border-slate-200/80'}`;
                        btn.innerHTML = `<span>${labelHtml}</span>`;
                        carousel.appendChild(btn);
                    });

                    selectProvince(provKeys[0], 0);
                }
            }
            actualizarModoBotonUI();
        }

        function enableCarouselDrag() {
            const slider = document.getElementById('provinceCarousel');
            let isDown = false;
            let startX, scrollLeft;

            slider.addEventListener('mousedown', (e) => {
                isDown = true;
                startX = e.pageX - slider.offsetLeft;
                scrollLeft = slider.scrollLeft;
            });
            slider.addEventListener('mouseleave', () => { isDown = false; });
            slider.addEventListener('mouseup', () => { isDown = false; });
            slider.addEventListener('mousemove', (e) => {
                if(!isDown) return;
                e.preventDefault();
                const x = e.pageX - slider.offsetLeft;
                slider.scrollLeft = scrollLeft - (x - startX) * 2;
            });
        }

        window.addEventListener('scroll', () => {
            const btnScroll = document.getElementById('btnScrollTop');
            if (window.scrollY > 300) {
                btnScroll.classList.remove('opacity-0', 'pointer-events-none');
                btnScroll.classList.add('opacity-100');
            } else {
                btnScroll.classList.add('opacity-0', 'pointer-events-none');
                btnScroll.classList.remove('opacity-100');
            }
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetWeb() {
            clearSearch();
            currentFilter = 'all';
            modoVista = 2;
            mostrarConsolidado = false;
            document.getElementById('consolidadoPanel').classList.add('hidden');
            actualizarModoBotonUI();
            
            const provKeys = Object.keys(CONFIG.SHEET_URLS || {});
            if(provKeys.length > 0) {
                selectProvince(provKeys[0], 0);
            }
        }

        function handleSearchInput() {
            const input = document.getElementById('searchInput');
            const btnClear = document.getElementById('btnClearSearch');
            
            if (input.value.trim().length > 0) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
            }

            if (searchDebounceTimeout) {
                clearTimeout(searchDebounceTimeout);
            }

            searchDebounceTimeout = setTimeout(() => {
                requestAnimationFrame(() => {
                    render();
                });
            }, 250);
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            const btnClear = document.getElementById('btnClearSearch');
            input.value = '';
            btnClear.classList.add('hidden');
            render();
        }

        function normalizeKey(str) {
            return (str || '').toString().trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function getFieldValue(row, fieldNames) {
            const rowKeys = Object.keys(row);
            for (let name of fieldNames) {
                const normTarget = normalizeKey(name);
                for (let k of rowKeys) {
                    if (normalizeKey(k) === normTarget) {
                        return row[k] ? row[k].toString().trim() : '';
                    }
                }
            }
            return '';
        }

        async function loadSheetData(provKey) {
            document.getElementById('districtContainer').innerHTML = `
                <div class="text-center py-12 text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin text-3xl text-amber-600 mb-3"></i>
                    <p class="text-xs sm:text-sm font-semibold">Cargando mesas de votación...</p>
                </div>
            `;

            const url = CONFIG.SHEET_URLS ? CONFIG.SHEET_URLS[provKey] : null;
            if (!url || url.includes('2PACX-1vXXXXX')) {
                document.getElementById('districtContainer').innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-5 rounded-2xl text-center text-xs sm:text-sm">
                        <i class="fa-solid fa-circle-info text-2xl mb-2 text-amber-600"></i>
                        <p class="font-bold text-sm sm:text-base">URL de Google Sheets requerida</p>
                        <p class="mt-1">Asigna la URL pública CSV para esta provincia en tu archivo <code>config.js</code>.</p>
                    </div>
                `;
                return;
            }

            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawData = results.data;
                    render();
                },
                error: function(err) {
                    document.getElementById('districtContainer').innerHTML = `<div class="bg-red-50 border border-red-200 text-red-700 p-5 rounded-2xl text-center text-xs">Error de conexión con Google Sheets. Verifique la publicación web.</div>`;
                }
            });
        }

        function selectProvince(provKey, idx) {
            clearSearch();
            currentProvinceKey = provKey;
            const provKeys = Object.keys(CONFIG.SHEET_URLS || {});
            provKeys.forEach((p, i) => {
                const btn = document.getElementById(`btn-prov-${i}`);
                if (btn) {
                    if (i === idx) {
                        btn.className = 'min-w-[130px] sm:min-w-[150px] h-14 sm:h-16 px-3 py-1.5 text-xs sm:text-sm rounded-2xl transition-all duration-200 text-center font-bold snap-start flex-shrink-0 flex items-center justify-center leading-tight tab-prov-active';
                    } else {
                        btn.className = 'min-w-[130px] sm:min-w-[150px] h-14 sm:h-16 px-3 py-1.5 text-xs sm:text-sm rounded-2xl transition-all duration-200 text-center font-bold snap-start flex-shrink-0 flex items-center justify-center leading-tight text-slate-700 hover:text-slate-900 bg-white shadow-xs border border-slate-200/80';
                    }
                }
            });
            loadSheetData(provKey);
        }

        function toggleConsolidado() {
            mostrarConsolidado = !mostrarConsolidado;
            const panel = document.getElementById('consolidadoPanel');
            if (mostrarConsolidado) {
                panel.classList.remove('hidden');
            } else {
                panel.classList.add('hidden');
            }
        }

        function toggleModoVista() {
            modoVista = modoVista === 1 ? 2 : 1;
            actualizarModoBotonUI();
            render();
        }

        function actualizarModoBotonUI() {
            const icon = document.getElementById('iconModo');
            if (modoVista === 2) {
                icon.className = 'fa-solid fa-list text-slate-600 text-sm sm:text-base';
            } else {
                icon.className = 'fa-solid fa-border-all text-amber-600 text-sm sm:text-base';
            }
        }

        function setFilter(filter) {
            currentFilter = filter;
            document.getElementById('filter-all').className = filter === 'all' ? 'py-1.5 px-2 rounded-xl text-center bg-slate-900 text-white font-bold' : 'py-1.5 px-2 rounded-xl text-center text-slate-700 bg-slate-50 border border-slate-200';
            document.getElementById('filter-assigned').className = filter === 'assigned' ? 'py-1.5 px-2 rounded-xl text-center bg-slate-900 text-white font-bold' : 'py-1.5 px-2 rounded-xl text-center text-slate-700 bg-slate-50 border border-slate-200';
            document.getElementById('filter-unassigned').className = filter === 'unassigned' ? 'py-1.5 px-2 rounded-xl text-center bg-slate-900 text-white font-bold' : 'py-1.5 px-2 rounded-xl text-center text-slate-700 bg-slate-50 border border-slate-200';
            render();
        }

        function toggleMesa(id) {
            const elPersonero = document.getElementById(id);
            const elUbicacion = document.getElementById(`${id}-loc`);
            if (elPersonero) elPersonero.classList.toggle('hidden');
            if (elUbicacion) elUbicacion.classList.toggle('hidden');
        }

        // Función auxiliar para generar el HTML de Miembros de Mesa
        function generarHTMLMiembrosMesa(titulares, suplentes) {
            let htmlTitulares = '';
            titulares.forEach((t, i) => {
                if (t) {
                    htmlTitulares += `<li class="text-[10px] text-slate-700 flex items-start gap-1"><span class="font-bold text-amber-600 min-w-[18px]">${i+1}°:</span> <span class="font-semibold">${t}</span></li>`;
                }
            });

            let htmlSuplentes = '';
            suplentes.forEach((s, i) => {
                if (s) {
                    htmlSuplentes += `<li class="text-[10px] text-slate-600 flex items-start gap-1"><span class="font-bold text-slate-400 min-w-[18px]">S${i+1}:</span> <span>${s}</span></li>`;
                }
            });

            if (!htmlTitulares && !htmlSuplentes) {
                return `<p class="text-[10px] text-slate-400 italic">No hay información de miembros de mesa.</p>`;
            }

            return `
                <div class="space-y-2">
                    ${htmlTitulares ? `
                        <div>
                            <p class="text-[9px] font-bold uppercase text-amber-700 tracking-wider mb-1"><i class="fa-solid fa-user-check mr-1"></i>Titulares</p>
                            <ul class="space-y-0.5 bg-amber-50/50 p-1.5 rounded-lg border border-amber-100">${htmlTitulares}</ul>
                        </div>
                    ` : ''}
                    
                    ${htmlSuplentes ? `
                        <div>
                            <p class="text-[9px] font-bold uppercase text-slate-500 tracking-wider mb-1"><i class="fa-solid fa-users mr-1"></i>Suplentes</p>
                            <div class="max-h-24 overflow-y-auto custom-scroll bg-slate-50 p-1.5 rounded-lg border border-slate-200">
                                <ul class="space-y-0.5">${htmlSuplentes}</ul>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function abrirModalMesaByNum(numMesa) {
            const item = window.mesaByNumMap[numMesa];
            if (!item) return;

            const modal = document.getElementById('mesaModal');
            const body = document.getElementById('modalBody');

            let html = `
                <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 space-y-2">
                    <div class="flex items-center gap-3">
                        <div class="w-11 h-11 rounded-xl bg-white p-0.5 border border-slate-200 flex-shrink-0 flex items-center justify-center overflow-hidden shadow-xs">
                            <img src="portadas/${item.idLocal}.jpg" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=IE';" alt="Local" class="w-full h-full object-cover rounded-lg">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center justify-between gap-1 mb-0.5">
                                <span class="text-[9px] text-slate-500 font-bold uppercase">MESA DE VOTACIÓN</span>
                                <span class="text-[8px] font-bold uppercase px-2 py-0.5 rounded-md ${item.hasPersonero ? 'bg-blue-600 text-white' : 'bg-red-500 text-white'}">
                                    ${item.hasPersonero ? 'ASIGNADA' : 'SIN PERSONERO'}
                                </span>
                            </div>
                            <div class="text-lg font-black text-slate-900">N° ${item.mesa}</div>
                        </div>
                    </div>
                    
                    <div class="space-y-1 pt-1 border-t border-slate-200/80">
                        <div class="text-[11px] text-slate-800 font-bold leading-snug break-words" title="${item.local}">
                            <i class="fa-solid fa-school text-amber-600 mr-1"></i>${item.local}
                        </div>
                        <div class="text-[10px] text-slate-500 font-medium break-words" title="${item.direccion}">
                            <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${item.direccion}
                        </div>
                        <div class="text-[9px] text-slate-500 font-semibold text-right w-full pt-1 border-t border-slate-200/60 tracking-tight break-words">
                            <i class="fa-solid fa-map-pin text-[8px] mr-1 text-slate-400"></i>${item.region} • ${item.provincia} • ${item.distrito}
                        </div>
                    </div>
                </div>
            `;

            if (item.hasPersonero) {
                html += `
                    <div class="bg-blue-50/90 p-2.5 rounded-2xl border border-blue-200 space-y-1">
                        <p class="font-bold text-blue-900 border-b border-blue-200 pb-1 flex justify-between items-center text-xs">
                            <span>Titular: ${item.p1.tipo}</span>
                            ${item.p1.cel ? `<a href="tel:${item.p1.cel}" class="bg-blue-600 text-white px-2 py-0.5 rounded-lg text-[9px] font-bold"><i class="fa-solid fa-phone"></i> ${item.p1.cel}</a>` : ''}
                        </p>
                        <p class="font-bold text-slate-800 text-xs">${item.p1.nombres} ${item.p1.apellidos}</p>
                        <p class="text-slate-500 text-[10px]">DNI: ${item.p1.dni}</p>
                    </div>
                `;

                if (item.p2) {
                    html += `
                        <div class="bg-amber-50/90 p-2.5 rounded-2xl border border-amber-200 space-y-1">
                            <p class="font-bold text-amber-900 border-b border-amber-200 pb-1 flex justify-between items-center text-xs">
                                <span>Suplente: ${item.p2.tipo}</span>
                                ${item.p2.cel ? `<a href="tel:${item.p2.cel}" class="bg-amber-600 text-white px-2 py-0.5 rounded-lg text-[9px] font-bold"><i class="fa-solid fa-phone"></i> ${item.p2.cel}</a>` : ''}
                            </p>
                            <p class="font-bold text-slate-800 text-xs">${item.p2.nombres} ${item.p2.apellidos}</p>
                            <p class="text-slate-500 text-[10px]">DNI: ${item.p2.dni}</p>
                        </div>
                    `;
                } else {
                    html += `<p class="text-[10px] text-slate-400 italic text-center">Sin personero suplente asignado</p>`;
                }
            } else {
                html += `
                    <div class="bg-red-50 p-3 rounded-2xl border border-red-200 text-center text-red-600 font-semibold text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-lg mb-0.5 block"></i>
                        Esta mesa requiere asignación de personero.
                    </div>
                `;
            }

            // APARTADO SEPARADO VISUALMENTE PARA MIEMBROS DE MESA EN MODAL
            html += `
                <div class="mt-3 pt-3 border-t-2 border-dashed border-slate-200">
                    <div class="bg-amber-500/10 border border-amber-300/60 p-2.5 rounded-2xl space-y-2">
                        <div class="flex items-center gap-1.5 border-b border-amber-200 pb-1">
                            <i class="fa-solid fa-id-card text-amber-600 text-xs"></i>
                            <h4 class="font-extrabold text-amber-900 text-xs uppercase tracking-tight">Miembros de Mesa</h4>
                        </div>
                        ${generarHTMLMiembrosMesa(item.titularesMM, item.suplentesMM)}
                    </div>
                </div>
            `;

            body.innerHTML = html;
            modal.classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('mesaModal').classList.add('hidden');
        }

        function render() {
            const container = document.getElementById('districtContainer');
            container.innerHTML = '';
            window.mesaByNumMap = {};

            const search = document.getElementById('searchInput').value.toLowerCase().trim();
            const grouped = {};
            let totalAll = 0, totalAssigned = 0, totalUnassigned = 0;

            rawData.forEach((row, idx) => {
                const dist = getFieldValue(row, ['DISTRITO']) || 'SIN DISTRITO';
                const prov = getFieldValue(row, ['PROVINCIA']) || currentProvinceKey || 'PROVINCIA';
                const reg = getFieldValue(row, ['REGION', 'DEPARTAMENTO']) || (typeof CONFIG !== 'undefined' ? CONFIG.NOMBRE_REGION : 'PASCO');
                const mesa = getFieldValue(row, ['NÚMERO DE MESA', 'NUMERO DE MESA', 'MESA']);
                const idLocal = getFieldValue(row, ['ID LOCAL', 'ID_LOCAL']);
                const local = getFieldValue(row, ['NOMBRE LOCAL', 'NOMBRE_LOCAL', 'LOCAL']);
                const direccion = getFieldValue(row, ['DIRECCIÓN LOCAL', 'DIRECCION LOCAL', 'DIRECCION_LOCAL', 'DIRECCIÓN_LOCAL', 'DIRECCION']) || 'Dirección no registrada';
                
                const dniP1 = getFieldValue(row, ['PERSONERO1_DNI']);
                const nombresP1 = getFieldValue(row, ['PERSONERO1_NOMBRES']);
                const apellidosP1 = getFieldValue(row, ['PERSONERO1_APELLIDOS']);
                const tipoP1 = getFieldValue(row, ['PERSONERO1_TIPO']) || 'Personero de Mesa';
                const celP1 = getFieldValue(row, ['PERSONERO1_CELULAR']);

                const dniP2 = getFieldValue(row, ['PERSONERO2_DNI']);
                const nombresP2 = getFieldValue(row, ['PERSONERO2_NOMBRES']);
                const apellidosP2 = getFieldValue(row, ['PERSONERO2_APELLIDOS']);
                const tipoP2 = getFieldValue(row, ['PERSONERO2_TIPO']) || 'Suplente';
                const celP2 = getFieldValue(row, ['PERSONERO2_CELULAR']);

                // Miembros de Mesa
                const titularesMM = [
                    getFieldValue(row, ['1MM']),
                    getFieldValue(row, ['2MM']),
                    getFieldValue(row, ['3MM'])
                ];
                const suplentesMM = [
                    getFieldValue(row, ['S1']),
                    getFieldValue(row, ['S2']),
                    getFieldValue(row, ['S3']),
                    getFieldValue(row, ['S4']),
                    getFieldValue(row, ['S5']),
                    getFieldValue(row, ['S6'])
                ];

                const hasPersonero = dniP1 !== '';

                if (hasPersonero) totalAssigned++; else totalUnassigned++;
                totalAll++;

                if (currentFilter === 'assigned' && !hasPersonero) return;
                if (currentFilter === 'unassigned' && hasPersonero) return;

                if (search) {
                    const mesaLimpia = mesa.replace(/^0+/, '');
                    const searchLimpia = search.replace(/^0+/, '');
                
                    const coincideMesa = 
                        mesa.toLowerCase().includes(search) || 
                        (mesaLimpia !== '' && (
                            mesaLimpia === searchLimpia ||     
                            mesaLimpia.includes(searchLimpia)  
                        ));
                
                    const matchText = `${dist} ${prov} ${reg} ${local} ${nombresP1} ${apellidosP1} ${dniP1} ${titularesMM.join(' ')} ${suplentesMM.join(' ')}`.toLowerCase();
                    const coincideOtros = matchText.includes(search);
                
                    if (!coincideMesa && !coincideOtros) return;
                }

                const itemObj = {
                    idx, mesa, idLocal, local, direccion, distrito: dist, provincia: prov, region: reg, hasPersonero,
                    p1: hasPersonero ? { dni: dniP1, nombres: nombresP1, apellidos: apellidosP1, tipo: tipoP1, cel: celP1 } : null,
                    p2: dniP2 !== '' ? { dni: dniP2, nombres: nombresP2, apellidos: apellidosP2, tipo: tipoP2, cel: celP2 } : null,
                    titularesMM,
                    suplentesMM
                };

                window.mesaByNumMap[mesa] = itemObj;

                if (!grouped[dist]) grouped[dist] = [];
                grouped[dist].push(itemObj);
            });

            document.getElementById('cnt-all').innerText = totalAll;
            document.getElementById('cnt-assigned').innerText = totalAssigned;
            document.getElementById('cnt-unassigned').innerText = totalUnassigned;

            if (Object.keys(grouped).length === 0) {
                container.innerHTML = `<div class="bg-white p-6 text-center rounded-2xl border border-slate-200 text-slate-500 text-xs sm:text-sm">No se encontraron mesas que coincidan.</div>`;
                return;
            }

            for (const [distrito, mesas] of Object.entries(grouped)) {
                const distSection = document.createElement('section');
                distSection.className = 'bg-white p-3.5 sm:p-4 rounded-2xl shadow-sm border border-slate-200/80 section-district';

                let html = `
                    <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-3">
                        <h2 class="text-xs sm:text-sm font-black text-slate-900 flex items-center gap-2 uppercase tracking-wide">
                            <span class="w-2 h-3.5 bg-amber-500 rounded-full inline-block"></span>
                            ${distrito}
                        </h2>
                        <span class="text-[10px] sm:text-[11px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-bold">
                            ${mesas.length} mesas
                        </span>
                    </div>
                `;

                if (modoVista === 1) {
                    html += `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5">`;

                    mesas.forEach((m) => {
                        const cardBg = m.hasPersonero ? 'bg-blue-50/90 border-blue-200 hover:border-blue-400' : 'bg-red-50/90 border-red-200 hover:border-red-400';
                        const badgeBg = m.hasPersonero ? 'bg-blue-600 text-white' : 'bg-red-500 text-white';
                        const mesaId = `mesa-${distrito.replace(/[^a-zA-Z0-9]/g, '')}-${m.idx}`;

                        html += `
                            <div class="border rounded-xl p-2.5 transition shadow-2xs ${cardBg} flex flex-col justify-between cursor-pointer" onclick="toggleMesa('${mesaId}')">
                                <div>
                                    <div class="flex items-start gap-2.5">
                                        <div class="w-12 h-12 rounded-xl bg-white p-0.5 border border-slate-200 flex-shrink-0 flex items-center justify-center overflow-hidden shadow-xs mt-0.5">
                                            <img src="portadas/${m.idLocal}.jpg" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/50?text=IE';" alt="Local" class="w-full h-full object-cover rounded-lg">
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <div class="flex items-center justify-between gap-1 mb-1">
                                                <div class="flex items-baseline gap-1">
                                                    <span class="text-[10px] font-bold uppercase text-slate-500">MESA</span>
                                                    <span class="text-sm font-black tracking-tight text-slate-900">N° ${m.mesa}</span>
                                                </div>
                                                <span class="text-[8px] font-bold uppercase px-2 py-1 rounded-md ${badgeBg}">
                                                    ${m.hasPersonero ? 'ASIGNADA' : 'SIN PERSONERO'}
                                                </span>
                                            </div>
                                            <div class="text-[11px] text-slate-800 font-bold leading-snug break-words" title="${m.local}">
                                                <i class="fa-solid fa-school text-amber-600 mr-1"></i>${m.local}
                                            </div>
                                            <div class="text-[10px] text-slate-500 font-medium mt-0.5 break-words" title="${m.direccion}">
                                                <i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${m.direccion}
                                            </div>
                                        </div>
                                        <i class="fa-solid fa-chevron-down text-slate-400 text-xs flex-shrink-0 self-center"></i>
                                    </div>

                                    <div id="${mesaId}-loc" class="hidden text-[9px] text-slate-400 font-semibold text-right pr-2 mt-1.5 pt-1.5 border-t border-slate-200/60 tracking-tight">
                                        <i class="fa-solid fa-map-pin text-[8px] mr-1 text-slate-400"></i>${m.region} • ${m.provincia} • ${m.distrito}
                                    </div>
                                </div>

                                <div id="${mesaId}" class="hidden mt-2 pt-2 border-t border-slate-200/80 text-xs text-slate-700 bg-white p-2.5 rounded-xl shadow-inner space-y-2" onclick="event.stopPropagation()">
                                    ${m.hasPersonero ? `
                                        <div>
                                            <p class="font-bold text-blue-900 border-b border-blue-100 pb-0.5 flex justify-between items-center text-[11px]">
                                                <span>Titular: ${m.p1.tipo}</span>${m.p1.cel ? `<a href="tel:${m.p1.cel}" class="text-blue-600 font-bold"><i class="fa-solid fa-phone"></i> ${m.p1.cel}</a>` : ''}
                                            </p>
                                            <p class="mt-0.5 font-bold text-slate-800 text-[11px]">${m.p1.nombres}${m.p1.apellidos}</p>
                                            <p class="text-slate-500 text-[10px]">DNI: ${m.p1.dni}</p>
                                        </div>
                                        ${m.p2 ? `
                                        <div class="pt-1.5 border-t border-slate-100">
                                            <p class="font-bold text-amber-800 border-b border-amber-100 pb-0.5 flex justify-between items-center text-[11px]">
                                                <span>Suplente: ${m.p2.tipo}</span>
                                                ${m.p2.cel ? `<a href="tel:${m.p2.cel}" class="text-amber-600 font-bold"><i class="fa-solid fa-phone"></i> ${m.p2.cel}</a>` : ''}
                                            </p>
                                            <p class="mt-0.5 font-bold text-slate-800 text-[11px]">${m.p2.nombres} ${m.p2.apellidos}</p>
                                            <p class="text-slate-500 text-[10px]">DNI: ${m.p2.dni}</p>
                                        </div>
                                        ` : '<p class="text-[10px] text-slate-400 italic">Sin suplente asignado</p>'}
                                    ` : `
                                        <p class="text-red-600 font-bold text-center py-0.5 text-[11px]">
                                            <i class="fa-solid fa-circle-exclamation mr-1"></i> Sin personero
                                        </p>
                                    `}

                                    <!-- SECCIÓN DE MIEMBROS DE MESA EN VISTA COMPACTA -->
                                    <div class="pt-2 border-t-2 border-dashed border-slate-200">
                                        <div class="bg-amber-50/70 border border-amber-200/80 p-2 rounded-lg space-y-1.5">
                                            <p class="font-bold text-amber-900 text-[10px] uppercase flex items-center gap-1">
                                                <i class="fa-solid fa-id-card text-amber-600"></i> Miembros de Mesa
                                            </p>
                                            ${generarHTMLMiembrosMesa(m.titularesMM, m.suplentesMM)}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                } 
                else {
                    html += `<div class="grid grid-cols-4 gap-1.5 sm:gap-2.5">`;

                    mesas.forEach((m) => {
                        const cardBg = m.hasPersonero ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-red-500 text-white hover:bg-red-600';

                        html += `
                            <div onclick="abrirModalMesaByNum('${m.mesa}')" class="${cardBg} rounded-xl p-1.5 transition shadow-xs flex items-center gap-1 cursor-pointer border border-white/20 active:scale-95">
                                <div class="w-6 h-6 sm:w-7 sm:h-7 rounded-md bg-white p-0.5 flex-shrink-0 flex items-center justify-center overflow-hidden shadow-2xs">
                                    <img src="portadas/${m.idLocal}.jpg" loading="lazy" onerror="this.onerror=null; this.src='https://via.placeholder.com/30?text=IE';" alt="Local" class="w-full h-full object-cover rounded">
                                </div>
                                <div class="overflow-hidden">
                                    <div class="text-[7px] sm:text-[8px] opacity-80 font-bold uppercase leading-none">Mesa</div>
                                    <div class="text-[10px] sm:text-xs font-black leading-tight truncate">${m.mesa}</div>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div>`;
                }

                distSection.innerHTML = html;
                container.appendChild(distSection);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initConfig();
            enableCarouselDrag();
        });
    </script>
</body>
</html>
